<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href=".style.css">
    <title>Configuração</title>
</head>
<body>
   <header>
  
      <img src="../img/logo.png" alt="">
 
      <h4>Configurações</h4>
      <h4>Dados Pessoais</h4>
      <h4>Sair da conta</h4>

    <div class="header-actions">
      <div class="search-bar">
        <span class="icon-search">🔍</span>
        <input type="text" id="productSearch" placeholder="digite o Produto">
      </div>

      <button class="icon-btn" title="Configurações">⚙️</button>
      <button class="icon-btn" title="Perfil">👤</button>
      <button class="icon-btn" title="Carrinho">🛒</button>
    </div>
  </header>

  <section class="settings-card pink">
        <h2 class="section-heading">Segurança</h2>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-title">Senha</span>
            <span class="setting-desc">Última alteração há 3 meses</span>
          </div>
          <button type="button" class="btn-dark">Alterar senha</button>
        </div>
        <hr class="setting-divider">

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-title">Verificação em duas etapas</span>
            <span class="setting-desc">Mais proteção para login</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
      </section>
    
</body>
</html>
