<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtlasWay</title>
    <link rel="stylesheet" href="../styles/cadastro.css">
    
</head>
<body>
    <img src="../img/img_login.png" alt="">
    <header>
        <section>
        <h1>CRIAR SUA CONTA</h1>
        <p>Lorem ipsum dolor sit amet consectetur </p>
        <br>
        <form action="nome_completo">
            <div class="form-control">
                <label for="name">
                    Nome completo: 
                </label>
                
                <input type="text" id="name" placeholder="digite seu nome...">
            </div>
            <br>
            <div class="form-control">
                <label for="Email">
                    E-mail:
                </label>
                <input type="text" id="Email">
            </div>
            <br>
            <div class="form-control">
                <label for="password">
                   Senha:
                </label>
                <input type="password" id="senha" placeholder="digite sua senha...">
               
            </div>
             <br>
            <div class="form-control">
                <label for="password">
                    Confirmar senha:
                </label>
                <input type="password" id="Confirmar senha " placeholder="confirme sua senha...">
            </div>
           
                 <div class ="termos">
                    <input type="checkbox" id="termos"/>
                    <label for="termos">Li e concordo com os termos de privacidade</label>
            
            <button onclick="Entrar">
                Entrar
            </button>
                
            
</section>

    </header>
</body>
</html>
