<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtlasWay</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/cadastro.css">
    
</head>
<body>
    <img src="../img/img_login.png" alt="">
    <header>
        <section>
        <h1>CRIAR SUA CONTA</h1>
        <p>Leve menos de um minuto e tenha acesso aos melhores produtos do mercado</p>
        <br>
        <form action="nome_completo">
            <div class="form-control">
                <label for="name">
                    Nome completo: 
                </label>
                
                <input type="text" id="name" placeholder="Digite o seu nome">
            </div>
            <br>
            <div class="form-control">
                <label for="Email">
                    E-mail:
                </label>
                <input type="text" id="Email" placeholder="Digite o seu Email">
            </div>
            <br>
            <div class="form-control">
                <label for="password">
                   Senha:
                </label>
                <input type="password" id="senha" placeholder="digite o sua senha">
               
            </div>
             <br>
            <div class="form-control">
                <label for="password">
                    Confirmar senha:
                </label>
                <input type="password" id="Confirmar senha " placeholder="Comfirme sua senha">
            </div>
</section>
    </header>
</body>
</html>
