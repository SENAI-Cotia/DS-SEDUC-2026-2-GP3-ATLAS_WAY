<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLASWAY - Comércio Global | Dados Pessoais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
  
      <img src="../img/logo.png" alt="">
 
      <h4>Configurações</h4>
      <h4>Dados Pessoais</h4>
      <h4>Sair da conta</h4>

    <div class="header-actions">
      <div class="search-bar">
        <span class="icon-search">🔍</span>
        <input type="text" id="productSearch" placeholder="digite o Produto">
      </div>

      <button class="icon-btn" title="Configurações">⚙️</button>
      <button class="icon-btn" title="Perfil">👤</button>
      <button class="icon-btn" title="Carrinho">🛒</button>
    </div>
  </header>
  <img src="..//img/rastreameto2.png" alt="rastreamento" class="rastreio">
  <img src="../img/compra.png" alt="linha" class="linha">
  <img src="../img/dados.png" alt="dados" class="dados">

<section class="buy-again-card">
        <h2 class="buy-again-title">Compre novamente</h2>

        <div class="products-grid">
          <div class="product-item lilac">
            <div class="product-illustration">
              <img src="../img/Captura de tela 2026-11-26 100545.png" alt="Sérum Facial">
            </div>
            <div class="product-name">Sérum Facial</div>
            <div class="product-price">R$ 90,50</div>
            <button class="btn-buy-again">Comprar de novo</button>
          </div>

          <div class="product-item cyan">
            <div class="product-illustration">
              <img src="../img/oleo.png" alt="Óleo de Limpeza Ginseng">
            </div>
            <div class="product-name">Óleo de Limpeza Ginseng</div>
            <div class="product-price">R$ 79,00</div>
            <button class="btn-buy-again">Comprar de novo</button>
          </div>

          <div class="product-item pink">
            <div class="product-illustration">
              <img src="../img/tonico.png" alt="Tônico Calmante">
            </div>
            <div class="product-name">Tônico Calmante</div>
            <div class="product-price">R$ 70,00</div>
            <button class="btn-buy-again">Comprar de novo</button>
          </div>

          <div class="product-item lilac">
            <div class="product-illustration">
              <img src="../img/lamen.png" alt="Lámen Buldak Picante">
            </div>
            <div class="product-name">Lámen Buldak Picante</div>
            <div class="product-price">R$ 39,40</div>
            <button class="btn-buy-again">Comprar de novo</button>
          </div>
        </div>
      </section>
      <section class="address-card">
        <h2 class="section-heading">Endereço de entrega</h2>

        <div class="address-details">
          <span class="house-icon">🏠</span>
          <div class="address-text">
            <span class="address-street">Rua das Flores, 123</span>
            <span class="address-city">Cotia, SP · CEP 02300-500</span>
          </div>
        </div>

        <button class="btn-add-address">
          Adicionar endereço 🏠
        </button>
      </section>

    </div>


 </body>
</html>
