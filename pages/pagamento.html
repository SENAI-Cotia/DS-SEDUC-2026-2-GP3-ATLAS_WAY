<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/pagamento.css">
    <title>Document</title>
</head>
<body>
    <img src="../imagens/logo.png" alt="Imagem do produto" style="width: 300px; height: auto;">
    <hr>
    <div class="container">
        <h1>Pagamento</h1>
        <form action="../pages/confirmacao.html" method="POST">
            <label for="CEP">CEP:</label>
            <input type="text" id="CEP" name="CEP" required>

            <label for="UF">UF:</label>
            <input type="text" id="UF" name="UF" required>

            <label for="lagadouro">Lagadouro:</label>
            <input type="text" id="lagadouro" name="lagadouro" required>

            <label for="Número">Número:</label>
            <input type="text" id="Número" name="Número" placeholder="MM/AA" required>

            <label for="Complemento">Complemento:</label>
            <input type="text" id="Complemento" name="Complemento" required>
            <hr>
        </form>
    
    <p>Forma de pagamento:</p>
        
        <form action="/processar-pagamento" method="POST">
    <fieldset>
        <legend>Escolha a forma de pagamento:</legend>

        <div>
        <input type="radio" id="pix" name="forma_pagamento" value="pix" checked>
        <label for="pix">Pix (Aprovação imediata)</label>
        </div>

        <div>
        <input type="radio" id="credito" name="forma_pagamento" value="cartao_credito">
        <label for="credito">Cartão de Crédito</label>
        </div>

        <div>
        <input type="radio" id="debito" name="forma_pagamento" value="cartao_debito">
        <label for="debito">Cartão de Débito</label>
        </div>

        <div>
        <input type="radio" id="boleto" name="forma_pagamento" value="boleto">
        <label for="boleto">Boleto Bancário</label>
        </div>
    </fieldset>

    <button type="submit">Finalizar Compra</button>
    </form>

        <div class="container">
            <h1>Resumo do pedido</h1>
            <p>Produto: Pads tônico</p>
            <p>Produto: R$ 189,99</p>
            <p>Preço: R$ 10,00</p>
            <hr>
            <p>Total: R$ 199,99</p>
            <button type="submit">Concluir Compra</button>
        </div>
</body>
</html>
